<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e10">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="AmyraxVPN · t.me/AmyraxVPN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="آنتن">
  <title>آنتن، iRegister</title>
  <meta name="description" content="ساخت پروفایل APN آیفون، عیب‌یابی اتصال و ثبت نتیجهٔ آزمایش">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <link rel="preload" href="/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=__BUILD__">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>آنتن</h1>
          <p>پروفایل APN و عیب‌یابی اتصال · iRegister</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="تغییر پوسته">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </button>
        <button class="icon-btn" id="statusBtn" type="button" aria-label="وضعیت سرویس">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 19v-4m5 4v-7m5 7V8m5 11V4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="بخش‌ها">
      <button class="tab" data-tab="build" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <span>ساخت</span>
      </button>
      <button class="tab" data-tab="guide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13H6z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M9 11h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>راهنما</span>
      </button>
      <button class="tab" data-tab="history" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 8v4.4l3 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span>تاریخچه</span>
      </button>
      <button class="tab" data-tab="about" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor"/></svg>
        <span>درباره</span>
      </button>
    </nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <span class="sheet-beam" aria-hidden="true"></span>
      <div class="sheet-head">
        <h2 id="sheetTitle">پروفایل</h2>
        <button class="icon-btn" type="button" data-close="1" aria-label="بستن">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js?v=__BUILD__"></script>
</body>
</html>
